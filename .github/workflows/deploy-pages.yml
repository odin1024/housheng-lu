name: Deploy to GitHub Pages

# 公网访问: https://<owner>.github.io/<repo>/
#
# 说明:
#   · GitHub Pages 只能托管**静态**站点, 所以这里做静态导出(output: 'export')。
#   · 静态导出不支持 route handler → 构建前把 src/app/api 临时移走;
#     此时 /ask 的 AI 部分自动降级为纯检索(页面会显示「未启用（纯检索）」), 站点功能完整。
#   · 想在公网用 AI, 请用支持 Node 运行时的托管(Vercel / 自建 Node), 见 README「部署」。
#   · 需要在仓库 Settings → Pages 里把 Source 设为 "GitHub Actions"。
#   · **三种触发**:
#       push                → 人工/机器推送代码后部署
#       workflow_call       → 由「同步上游」在提交新数据后**直接调用**(推荐路径)
#       workflow_dispatch   → 手动
#   · 为什么不让 sync 依赖"push 触发": 每日同步用 GITHUB_TOKEN 提交, 而 GitHub
#     **不会**为 GITHUB_TOKEN 推送的提交触发新 workflow(防递归) —— 实测线上因此冻结在
#     旧数据(仓库 772 条 / 线上 767 条)。workflow_call 是同一次运行内的调用, 不受此限制。

on:
  push:
    branches: [main]
  # 供「同步上游」在提交新数据后直接调用。
  # 不传 inputs: 被调用方 checkout 默认用 github.sha —— 那是调用方运行时的旧 commit,
  # 不含同步刚 push 的新数据。所以调用方必须**在自己 push 之后**调用,
  # 且被调用方显式 checkout main 头(见下面 checkout 步骤的 ref)。
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 显式 checkout main 头。
      # 被 workflow_call 调用时若用默认的 github.sha, 拿到的是调用方运行时的旧 commit,
      # 不含同步刚 push 的新数据 → 会构建出旧数据(实测: 线上停在 772 条而仓库已 774)。
      # 用 ref: main 拉分支头, 拿到的一定是最新提交。
      - uses: actions/checkout@v4
        with:
          ref: main

      # 顺序: pnpm 必须先于 setup-node (cache: 'pnpm' 需要 pnpm 可用)
      # 版本只由 package.json 的 packageManager 决定 (两处都写会报 Multiple versions of pnpm specified)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # pnpm 11 要求 Node >= 22.13
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 合规检查
        run: pnpm verify

      # 静态导出前移走 API 路由 (route handler 无法静态化)
      - name: 备份并移除 API 路由
        run: |
          mkdir -p /tmp/api-backup
          if [ -d src/app/api ]; then mv src/app/api /tmp/api-backup/; fi

      - name: 静态导出
        env:
          NEXT_OUTPUT: export
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      # 自检: 确认这次构建真的用了 checkout 到的那个 commit 的数据。
      #
      # 为什么需要: 之前踩过"部署成功但数据没更新"的静默故障 ——
      # workflow_call 场景下 checkout 默认拉 github.sha(旧 commit), 构建了旧数据,
      # 从外部完全看不出异常(绿色对勾 + 线上没变)。
      # 这里把"构建产物里的条目数"与"仓库里的条目数"对比, 不一致就让整个部署失败,
      # 故障立刻变成红色, 而不是让线上悄悄停在旧数据。
      # 注意: name 里含冒号时**必须加引号** —— 否则 YAML 会把它当成嵌套映射,
      # 整个 workflow 文件解析失败, GitHub 直接不运行它(不报错、不排队, 静默跳过)。
      # 实测踩过: 这一行写成 `- name: 自检: 构建产物是否用了最新数据` 后,
      # 从该 commit 起的每一次 push 都没有产生任何部署, 线上冻结 25 分钟无人察觉。
      - name: '自检: 构建产物是否用了最新数据'
        run: |
          set -e
          REPO_ENTRIES=$(node -e "console.log(require('./data/entries.json').length)")
          echo "仓库条目数: $REPO_ENTRIES"
          # 首选: 从打包进 client chunk 的统计模块读 (格式稳定, 单行)
          BUILT_ENTRIES=$(grep -rhoE '"totalEntries":[0-9]+' out/_next/static/chunks/ 2>/dev/null \
            | head -1 | grep -oE '[0-9]+' || true)

          # 兜底: 从导出的 HTML 里读。
          # 注意两点:
          #   1) 必须先 tr 去掉换行 —— HTML 里数字与相邻文字可能不在同一行, grep 逐行匹配会漏
          #   2) 匹配式里不写中文 —— bash 的 locale 可能是 C, 多字节中文按字节处理会失配
          if [ -z "$BUILT_ENTRIES" ]; then
            BUILT_ENTRIES=$(tr -d '\n' < out/index.html \
              | grep -oE '>[0-9]{3}</div>[[:space:]]*<div[^>]*>' \
              | head -1 | grep -oE '[0-9]{3}' || true)
          fi

          echo "构建产物条目数: ${BUILT_ENTRIES:-未找到}"
          if [ -z "$BUILT_ENTRIES" ]; then
            echo "::warning::未能从构建产物中读到条目数, 跳过校验(结构可能已变)"
            exit 0
          fi
          if [ "$BUILT_ENTRIES" != "$REPO_ENTRIES" ]; then
            echo "::error::构建产物条目数($BUILT_ENTRIES) != 仓库条目数($REPO_ENTRIES) —— 部署的是旧数据"
            exit 1
          fi
          echo "OK: 构建产物与仓库数据一致"

      # 单页路由的兜底(静态站点直接访问子路径时 404 的兜底页)
      - name: 生成 404 兜底
        run: |
          if [ -f out/404.html ]; then cp out/404.html out/404.html.bak || true; fi
          ls out | head -20

      # public/manifest.json 是静态文件, 里面的 start_url / icons 是根相对路径,
      # 部署到 /<repo>/ 子路径下会指向域名根 → PWA 安装与图标失效。这里就地加前缀。
      - name: 修正 manifest 的子路径
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -f out/manifest.json ]; then
            sed -i "s|\(\"start_url\": *\"\)/|\1/${REPO_NAME}/|; s|\(\"src\": *\"\)/|\1/${REPO_NAME}/|g; s|\(\"scope\": *\"\)/|\1/${REPO_NAME}/|" out/manifest.json
            echo "--- manifest 修正后 ---"; cat out/manifest.json
          fi

      - name: 关闭 Jekyll (否则 _next 目录会被忽略)
        run: touch out/.nojekyll

      # 不要加 enablement: true —— 用 GITHUB_TOKEN 启用 Pages 需要 admin 权限, 会 403。
      # Pages 已用带 public_repo 的 token 通过 API 一次性启用 (build_type=workflow);
      # 新建仓库(或迁移)时需要先启用一次, 见 README「部署 A」。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
