name: Deploy to GitHub Pages

# 公网访问: https://<owner>.github.io/<repo>/
#
# 说明:
#   · GitHub Pages 只能托管**静态**站点, 所以这里做静态导出(output: 'export')。
#   · 静态导出不支持 route handler → 构建前把 src/app/api 临时移走;
#     此时 /ask 的 AI 部分自动降级为纯检索(页面会显示「未启用（纯检索）」), 站点功能完整。
#   · 想在公网用 AI, 请用支持 Node 运行时的托管(Vercel / 自建 Node), 见 README「部署」。
#   · 需要在仓库 Settings → Pages 里把 Source 设为 "GitHub Actions"。
#   · **为什么还要 workflow_run 触发**: 每日同步(sync.yml) 是用 GITHUB_TOKEN 提交的,
#     而 GitHub 不会为 GITHUB_TOKEN 推送的提交触发新的 workflow(防递归) ——
#     只监听 push 的话, 上游数据更新后站点永远不会重新部署(实测线上冻结在 767 条,
#     而仓库里已是 772 条)。workflow_run 正是为这种链路准备的触发方式。

on:
  push:
    branches: [main]
  # 每日同步完成后(成功才部署) 再部署一次, 让线上跟上上游数据
  workflow_run:
    workflows: ['同步上游']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 只有两种来源才构建:
    #   · 人工/机器 push 到 main, 或手动触发 → 直接构建
    #   · workflow_run(同步上游完成) → 仅当同步成功
    # 写成显式三分支, 不依赖表达式短路行为
    if: |
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 默认拉的是"触发它的那个 commit"; 显式拉 main 的最新提交
          # (同步是先 push 再触发, 所以 main 上已经是新数据)
          ref: main

      # 顺序: pnpm 必须先于 setup-node (cache: 'pnpm' 需要 pnpm 可用)
      # 版本只由 package.json 的 packageManager 决定 (两处都写会报 Multiple versions of pnpm specified)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # pnpm 11 要求 Node >= 22.13
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 合规检查
        run: pnpm verify

      # 静态导出前移走 API 路由 (route handler 无法静态化)
      - name: 备份并移除 API 路由
        run: |
          mkdir -p /tmp/api-backup
          if [ -d src/app/api ]; then mv src/app/api /tmp/api-backup/; fi

      - name: 静态导出
        env:
          NEXT_OUTPUT: export
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      # 单页路由的兜底(静态站点直接访问子路径时 404 的兜底页)
      - name: 生成 404 兜底
        run: |
          if [ -f out/404.html ]; then cp out/404.html out/404.html.bak || true; fi
          ls out | head -20

      # public/manifest.json 是静态文件, 里面的 start_url / icons 是根相对路径,
      # 部署到 /<repo>/ 子路径下会指向域名根 → PWA 安装与图标失效。这里就地加前缀。
      - name: 修正 manifest 的子路径
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -f out/manifest.json ]; then
            sed -i "s|\(\"start_url\": *\"\)/|\1/${REPO_NAME}/|; s|\(\"src\": *\"\)/|\1/${REPO_NAME}/|g; s|\(\"scope\": *\"\)/|\1/${REPO_NAME}/|" out/manifest.json
            echo "--- manifest 修正后 ---"; cat out/manifest.json
          fi

      - name: 关闭 Jekyll (否则 _next 目录会被忽略)
        run: touch out/.nojekyll

      # 不要加 enablement: true —— 用 GITHUB_TOKEN 启用 Pages 需要 admin 权限, 会 403。
      # Pages 已用带 public_repo 的 token 通过 API 一次性启用 (build_type=workflow);
      # 新建仓库(或迁移)时需要先启用一次, 见 README「部署 A」。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
