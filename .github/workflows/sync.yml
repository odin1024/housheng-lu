name: 同步上游

on:
  schedule:
    # 每 24 小时一次, UTC 时间 06:00 (北京时间 14:00)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 供下面的 deploy job 判断"数据到底有没有变"
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 顺序: pnpm 必须先于 setup-node (cache: 'pnpm' 需要 pnpm 可用)
      # 版本只由 package.json 的 packageManager 决定 (两处都写会报 Multiple versions of pnpm specified)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # pnpm 11 要求 Node >= 22.13
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 同步上游
        run: pnpm sync

      - name: 解析为 JSON
        run: pnpm parse

      - name: 检查变更
        id: check
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 提交变更
        id: commit
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "housheng-lu-bot"
          git config user.email "bot@housheng.lu"
          git add data/
          git commit -m "chore(sync): upstream @ $(cd content/upstream && git rev-parse --short HEAD)"
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: 有数据变更时未能推送
        if: steps.check.outputs.changed == 'true' && steps.commit.outputs.pushed != 'true'
        run: |
          echo "数据有变更但未能推送, 跳过部署"
          exit 1

  # 数据变了就直接部署一次。
  # 不依赖"push 触发 deploy-pages": 本 workflow 用 GITHUB_TOKEN 提交,
  # GitHub 不会为它触发新的 workflow(防递归) —— 实测线上因此停在旧数据。
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
