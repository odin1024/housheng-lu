name: 同步上游

on:
  schedule:
    # 每 24 小时一次, UTC 时间 06:00 (北京时间 14:00)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 顺序: pnpm 必须先于 setup-node (cache: 'pnpm' 需要 pnpm 可用)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 同步上游
        run: pnpm sync

      - name: 解析为 JSON
        run: pnpm parse

      - name: 检查变更
        id: check
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 提交变更
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "housheng-lu-bot"
          git config user.email "bot@housheng.lu"
          git add data/
          git commit -m "chore(sync): upstream @ $(cd content/upstream && git rev-parse --short HEAD)"
          git push
