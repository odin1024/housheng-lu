<?xml version="1.0" encoding="UTF-8"?>
<!-- 厚生錄 favicon - V2 竖排方印 (统一 header 风格), 96x96 适配浏览器 tab + PWA -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="0.8"/>
    </filter>
  </defs>
  <!-- 外框: 方印 (比例与 V2 seal-square 一致) -->
  <rect x="8" y="8" width="80" height="80" rx="4"
        fill="none" stroke="#B73229" stroke-width="3" filter="url(#rough)"/>
  <!-- 顶部装饰小方块 -->
  <rect x="44" y="16" width="8" height="8" fill="#B73229" opacity="0.6"/>
  <!-- 文字: 竖排均匀分布 -->
  <g filter="url(#ink)" font-family="'LXGW WenKai TC', 'Songti SC', serif"
     font-weight="900" fill="#B73229" text-anchor="middle">
    <text x="48" y="42" font-size="22">厚</text>
    <text x="48" y="62" font-size="22">生</text>
    <text x="48" y="82" font-size="22">錄</text>
  </g>
  <!-- 底部装饰小方块 -->
  <rect x="44" y="78" width="8" height="8" fill="#B73229" opacity="0.6"/>
</svg>
