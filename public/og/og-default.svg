<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="paper" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#F2E8D5"/>
      <line x1="0" y1="0" x2="120" y2="120" stroke="#E8DCC0" stroke-width="0.5" opacity="0.5"/>
      <line x1="120" y1="0" x2="0" y2="120" stroke="#E8DCC0" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>

  <!-- 朱砂方印 Logo -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="120" height="120"
          fill="none" stroke="#B73229" stroke-width="4"/>
    <g font-family="'LXGW WenKai TC', 'Songti SC', serif" font-weight="900" fill="#B73229">
      <text x="60" y="50" text-anchor="middle" font-size="28">厚</text>
      <text x="38" y="82" text-anchor="middle" font-size="28">生</text>
      <text x="82" y="82" text-anchor="middle" font-size="28">錄</text>
    </g>
  </g>

  <!-- 主标语 -->
  <text x="240" y="170"
        font-family="'LXGW WenKai TC', 'Songti SC', serif"
        font-size="76" font-weight="900" fill="#2A2418"
        letter-spacing="8">厚生錄</text>

  <!-- 副标语 -->
  <text x="240" y="230"
        font-family="'LXGW WenKai TC', 'Songti SC', serif"
        font-size="28" fill="#6B5D4A"
        letter-spacing="4">七百条生计, 都在案头。</text>

  <text x="240" y="280"
        font-family="'EB Garamond', Georgia, serif"
        font-size="20" font-style="italic" fill="#8B3A3A"
        letter-spacing="2">HouSheng Lu · Records of Living Well</text>

  <line x1="240" y1="320" x2="1100" y2="320" stroke="#8B3A3A" stroke-width="1"/>

  <text x="240" y="370"
        font-family="'LXGW WenKai TC', 'Songti SC', serif"
        font-size="22" fill="#2A2418">《高性价比人生指南》视觉化再刊本</text>

  <text x="240" y="410"
        font-family="'LXGW WenKai TC', 'Songti SC', serif"
        font-size="18" fill="#6B5D4A">按 CC BY 4.0 衍生自 eternity4719/HowToLiveBetter</text>

  <!-- 印章装饰 -->
  <g transform="translate(1020, 480)">
    <rect x="0" y="0" width="80" height="80"
          fill="none" stroke="#B73229" stroke-width="3"/>
    <g font-family="'LXGW WenKai TC', 'Songti SC', serif" font-weight="900" fill="#B73229">
      <text x="40" y="34" text-anchor="middle" font-size="18">厚</text>
      <text x="26" y="58" text-anchor="middle" font-size="18">生</text>
      <text x="54" y="58" text-anchor="middle" font-size="18">錄</text>
    </g>
  </g>

  <text x="80" y="580"
        font-family="'LXGW WenKai TC', 'Songti SC', serif"
        font-size="14" fill="#6B5D4A">本站为非官方衍生作品, 与原作者无合作关系</text>
</svg>
