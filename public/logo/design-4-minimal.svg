<?xml version="1.0" encoding="UTF-8"?>
<!-- v4: 极简 100x100 - 现代印章, 留白多 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>
  <!-- 外框: 极简细线 -->
  <rect x="10" y="10" width="80" height="80" rx="2"
        fill="none" stroke="#B73229" stroke-width="1.5" filter="url(#rough)"/>
  <!-- 内部双线 (古籍页边距感) -->
  <rect x="14" y="14" width="72" height="72" rx="1"
        fill="none" stroke="#B73229" stroke-width="0.5" opacity="0.4"/>
  <!-- 文字: 三字竖排居中, 留白更大 -->
  <g font-family="'LXGW WenKai TC', 'Songti SC', serif"
     font-weight="900" fill="#B73229" text-anchor="middle">
    <text x="50" y="38" font-size="22">厚</text>
    <text x="50" y="62" font-size="22">生</text>
    <text x="50" y="86" font-size="22">錄</text>
  </g>
  <!-- 角落装饰小方块 -->
  <rect x="6" y="6" width="4" height="4" fill="#B73229"/>
  <rect x="90" y="6" width="4" height="4" fill="#B73229"/>
  <rect x="6" y="90" width="4" height="4" fill="#B73229"/>
  <rect x="90" y="90" width="4" height="4" fill="#B73229"/>
</svg>
