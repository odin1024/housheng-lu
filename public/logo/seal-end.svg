<?xml version="1.0" encoding="UTF-8"?>
<!-- 厚生錄 钤印 - V3 双线椭圆, 130×60, 像藏书印 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 60" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="0.8"/>
    </filter>
  </defs>
  <!-- 外框: 横向椭圆 -->
  <ellipse cx="65" cy="30" rx="58" ry="24"
           fill="none" stroke="#B73229" stroke-width="2.5" filter="url(#rough)"/>
  <!-- 内框: 双线古籍装订感 -->
  <ellipse cx="65" cy="30" rx="50" ry="20"
           fill="none" stroke="#B73229" stroke-width="0.8" opacity="0.5"/>
  <!-- 文字: 横排居中 -->
  <g filter="url(#ink)" font-family="'LXGW WenKai TC', 'Songti SC', serif"
     font-weight="900" fill="#B73229" text-anchor="middle">
    <text x="65" y="40" font-size="24" letter-spacing="6">厚生錄</text>
  </g>
</svg>
