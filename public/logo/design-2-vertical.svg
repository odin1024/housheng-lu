<?xml version="1.0" encoding="UTF-8"?>
<!-- v2: 竖排印章 - 最像传统朱印 100×140 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="0.8"/>
    </filter>
  </defs>
  <!-- 外框: 长方形 + 圆角, 更像古印 -->
  <rect x="6" y="6" width="88" height="128" rx="4"
        fill="none" stroke="#B73229" stroke-width="3" filter="url(#rough)"/>
  <!-- 顶部装饰: 小方块 -->
  <rect x="46" y="14" width="8" height="8" fill="#B73229" opacity="0.6"/>
  <!-- 文字: 竖排均匀分布 -->
  <g filter="url(#ink)" font-family="'LXGW WenKai TC', 'Songti SC', serif"
     font-weight="900" fill="#B73229" text-anchor="middle">
    <text x="50" y="50" font-size="32">厚</text>
    <text x="50" y="85" font-size="32">生</text>
    <text x="50" y="120" font-size="32">錄</text>
  </g>
  <!-- 底部装饰 -->
  <rect x="46" y="122" width="8" height="8" fill="#B73229" opacity="0.6"/>
</svg>
